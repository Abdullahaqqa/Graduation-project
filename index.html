<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإسعافات الأولية - دليل تفاعلي متكامل</title>
  <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animated { animation: fadeIn 0.5s ease-out; }
    .emergency-card:hover { transform: scale(1.02); }
  </style>
</head>
<body class="bg-green-50 text-gray-800">

<!-- نافذة الوقاية -->
<div id="preventionBox" class="fixed top-1/3 right-1/3 bg-white shadow-lg rounded-xl p-6 w-80 hidden z-50 border-2 border-green-600">
  <p id="preventionText" class="text-gray-800 text-lg whitespace-pre-line"></p>
  <button onclick="document.getElementById('preventionBox').classList.add('hidden')"
          class="mt-4 text-green-600 hover:text-green-800">✕ إغلاق</button>
</div>

<!-- شريط التنقل -->
<nav class="bg-green-600 p-4 text-white shadow-lg">
  <div class="container mx-auto flex justify-between items-center">
    <h1 class="text-2xl font-bold">🚑 دليل الإسعافات الأولية</h1>
    <div class="flex gap-4">
      <a href="tel:997" class="hover:text-yellow-300">📞 الطوارئ (997)</a>
      <a href="tel:937" class="hover:text-yellow-300">📞 وزارة الصحة (937)</a>
      <a href="#hospitalMap" class="hover:text-yellow-300">🗺 خريطة المستشفيات</a>
    </div>
  </div>
</nav>

<!-- المحتوى الرئيسي -->
<main class="container mx-auto px-6 py-10 space-y-12">
  <!-- بطاقات الحالات الطارئة -->
  <div class="grid md:grid-cols-3 gap-8">
    <template id="card-template">
      <div class="emergency-card bg-white rounded-xl p-8 shadow-md transition-transform cursor-pointer relative">
        <h3 class="text-2xl font-semibold text-green-700 mb-4 case-title"></h3>
        <p class="text-gray-600">اضغط لعرض طريقة التعامل</p>
        <button class="text-red-600 hover:text-red-800 mt-4" onclick="">❗ كيف أتفادى ذلك؟</button>
      </div>
    </template>
  </div>

  <!-- خطوات الإسعافات -->
  <div class="bg-white rounded-xl p-8 shadow-md animated hidden" id="stepsContainer">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800" id="caseTitle"></h2>
      <button onclick="closeSteps()" class="text-green-600 hover:text-green-800 text-xl">✕</button>
    </div>
    <div id="stepsWrapper"></div>
    <div class="flex justify-between mt-8">
      <button id="resetBtn" onclick="resetSteps()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 disabled:opacity-50">🔄 إعادة</button>
      <button id="nextBtn" onclick="nextStep()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">التالي →</button>
    </div>
    <p id="finishedMsg" class="text-center text-green-700 font-bold mt-6 hidden text-xl">🎉 انتهت خطوات الإسعافات الأولية!</p>
  </div>

  <!-- خريطة المستشفيات -->
  <div class="mt-12 bg-white rounded-xl p-8 shadow-md" id="hospitalMap">
    <h2 class="text-2xl font-bold mb-4">🏥 أقرب المراكز الطبية</h2>
    <div id="map" class="h-64 rounded-lg"></div>
  </div>
</main>

<!-- تذييل الصفحة -->
<footer class="bg-green-700 text-white py-6 mt-12">
  <div class="container mx-auto text-center">
    <p>تم التطوير بواسطة مصطفى محمد نضال و عبدالله سليمان خلف | مشروع تخرج 2025</p>
    <button onclick="toggleDarkMode()" class="mt-4 bg-green-600 px-4 py-2 rounded-lg hover:bg-green-500">🌙 الوضع الليلي</button>
  </div>
</footer>

<!-- Google Maps API -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>

<script>
const cases = {
  "الحروق": {
    steps: [
      { emoji: "💧", text: "برد الحرق فورًا بالماء البارد لمدة 10 دقائق." },
      { emoji: "🩹", text: "غطِّ المنطقة بضمادة نظيفة وغير لاصقة." },
      { emoji: "🚑", text: "استدعِ الإسعاف إذا كانت الحروق شديدة." }
    ],
    prevention: `🔥 لتجنب الحروق:
- أبقِ الأطفال بعيدين عن أدوات الطهي والمواقد.
- استخدم واقيات للفرن ولا تترك الزيت يسخن أكثر من اللازم.
- لا تترك الأجهزة الكهربائية موصلة بالكهرباء دون إشراف.`
  },
  "الغرق": {
    steps: [
      { emoji: "🚿", text: "أخرج الشخص من الماء وابدأ بالتنفس الاصطناعي إذا لزم." },
      { emoji: "🛏", text: "ضعه على جانبه لتجنب الاختناق بالقيء." },
      { emoji: "📞", text: "اتصل بالطوارئ فورًا." }
    ],
    prevention: `🌊 لتجنب الغرق:
- راقب الأطفال دائمًا عند قربهم من الماء، حتى في الحمام.
- لا تسبح في مناطق عميقة بدون رفيق أو دون معرفة بالسباحة.
- ارتدِ سترة النجاة عند ركوب القوارب أو التواجد في الأنهار.`
  },
  "الصعق الكهربائي": {
    steps: [
      { emoji: "🔌", text: "افصل مصدر الكهرباء قبل الاقتراب." },
      { emoji: "🩹", text: "فحص المصاب وتغطية أي حروق بضمادة." },
      { emoji: "🚑", text: "استدعِ الإسعاف وتابع العلامات الحيوية." }
    ],
    prevention: `⚡ لتجنب الصعق الكهربائي:
- تجنب لمس الأسلاك العارية أو الأجهزة الرطبة.
- أبعد الأطفال عن المقابس وضع حواجز أمان.
- افصل التيار أثناء الصيانة أو في حالات الطوارئ.`
  },
  "الإغماء": {
    steps: [
      { emoji: "✅", text: "تأكد من أن المكان آمن." },
      { emoji: "🛏", text: "ارفع الساقين لتحسين الدورة الدموية." },
      { emoji: "🗣", text: "تحدث مع المصاب وتحقق من وعيه." }
    ],
    prevention: `😵 لتجنب الإغماء:
- تناول وجبات منتظمة وتجنب الوقوف لفترات طويلة.
- اشرب الماء بكثرة، خاصة في الجو الحار.
- راجع الطبيب إذا تكررت حالات الدوار أو التعب.`
  },
  "انخفاض أو ارتفاع السكر": {
    steps: [
      { emoji: "🍬", text: "إذا كان منخفضًا، أعطه سكرًا سريع المفعول." },
      { emoji: "💧", text: "إذا كان مرتفعًا، وفر له الماء." },
      { emoji: "📞", text: "اتصل بالطبيب أو الإسعاف إذا استمر الوضع." }
    ],
    prevention: `🍭 لتفادي اضطرابات السكر:
- التزم بتناول الأدوية في مواعيدها.
- احمل دائمًا معك وجبة خفيفة تحتوي على سكر.
- راقب مستويات السكر بانتظام وتجنب الإجهاد الشديد.`
  },
  "الاختناق": {
    steps: [
      { emoji: "🤚", text: "اضغط بقبضة اليد على بطن المصاب (هيمليك)." },
      { emoji: "🗣", text: "تحقق من خروج الجسم الغريب." },
      { emoji: "🚑", text: "استدعِ الإسعاف فورًا." }
    ],
    prevention: `🫁 لتفادي الاختناق:
- قَطّع الطعام جيدًا للأطفال وراقبهم أثناء الأكل.
- تجنب الحديث أو الضحك أثناء المضغ.
- أبعد الأشياء الصغيرة عن متناول الأطفال.`
  },
  "الكسور والجروح": {
    steps: [
      { emoji: "🩹", text: "نظف الجرح وغطِّه بضمادة معقمة." },
      { emoji: "🔗", text: "ثبّت الكسر بجبيرة أو أي شيء صلب." },
      { emoji: "🚑", text: "استدعِ الإسعاف لنقل المصاب." }
    ],
    prevention: `🦴 لتفادي الكسور والجروح:
- تجنب السير على الأرضيات الزلقة دون حذر.
- استخدم أدوات الحماية أثناء ممارسة الرياضة.
- أبعد الأدوات الحادة واحفظها في أماكن آمنة.`
  },
  "ضربة الشمس": {
    steps: [
      { emoji: "☂", text: "انقل المصاب لمكان بارد ومظلل." },
      { emoji: "💧", text: "أعطه ماءً ببطء." },
      { emoji: "🚑", text: "اتصل بالطوارئ إذا ظهرت أعراض خطيرة." }
    ],
    prevention: `☀️ لتفادي ضربة الشمس:
- تجنب التعرض الطويل للشمس، خاصة في وقت الظهيرة.
- ارتدِ قبعة ونظارات شمسية وشرب الكثير من الماء.
- خذ فترات راحة متكررة في الظل عند العمل بالخارج.`
  }
};

// إنشاء البطاقات
const grid = document.querySelector('.grid');
const template = document.getElementById('card-template');
Object.keys(cases).forEach(name => {
  const clone = template.content.cloneNode(true);
  clone.querySelector('.case-title').textContent = name;
  const card = clone.querySelector('.emergency-card');
  card.addEventListener('click', () => showCase(name));
  const button = card.querySelector("button");
  button.setAttribute("onclick", `event.stopPropagation(); showPrevention('${name}')`);
  grid.appendChild(clone);
});

// عرض الخطوات
let currentStep = 0;
let currentSteps = [];

function showCase(name) {
  document.getElementById('caseTitle').textContent = name;
  currentSteps = cases[name].steps;
  currentStep = 0;
  renderSteps();
  document.getElementById('stepsContainer').classList.remove('hidden');
  document.getElementById('stepsContainer').scrollIntoView({ behavior: "smooth" });
}

function renderSteps() {
  const wrapper = document.getElementById('stepsWrapper');
  wrapper.innerHTML = "";
  currentSteps.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = (i === currentStep ? "" : "hidden ") + "space-y-4";
    div.innerHTML = `
      <div class="flex items-start gap-4">
        <span class="text-4xl">${s.emoji}</span>
        <p class="text-lg">${s.text}</p>
      </div>`;
    wrapper.appendChild(div);
  });
  document.getElementById('resetBtn').disabled = (currentStep === 0);
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('finishedMsg').classList.add('hidden');
}

function nextStep() {
  if (currentStep < currentSteps.length - 1) {
    currentStep++;
    renderSteps();
  } else {
    document.getElementById('finishedMsg').classList.remove('hidden');
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('resetBtn').disabled = false;
  }
}

function resetSteps() {
  currentStep = 0;
  renderSteps();
}

function closeSteps() {
  currentStep = 0;
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('finishedMsg').classList.add('hidden');
  renderSteps();
  document.getElementById('stepsContainer').classList.add('hidden');
}

// عرض الوقاية
function showPrevention(name) {
  const preventionText = cases[name].prevention;
  document.getElementById("preventionText").textContent = preventionText;
  document.getElementById("preventionBox").classList.remove("hidden");
}

// خريطة جوجل
function initMap() {
  const center = { lat: 24.7136, lng: 46.6753 };
  new google.maps.Map(document.getElementById("map"), {
    zoom: 12,
    center: center,
  });
}

// الوضع الليلي
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  document.body.style.backgroundColor = document.body.classList.contains('dark')
    ? '#1a202c'
    : '#ecfdf5';
}
</script>
</body>
</html>
