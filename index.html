<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإسعافات الأولية - دليل تفاعلي متكامل</title>
  <style>
    /* تنسيقات Tailwind مبسطة داخل الملف */
    body { background-color: #f0fff4; color: #2d3748; font-family: sans-serif; }
    .container { max-width: 1200px; margin: 0 auto; }
    .text-center { text-align: center; }
    .text-white { color: #fff; }
    .bg-green-600 { background-color: #16a34a; }
    .bg-green-700 { background-color: #15803d; }
    .bg-white { background-color: #fff; }
    .rounded-xl { border-radius: 0.75rem; }
    .shadow-md { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .shadow-lg { box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
    .p-4 { padding: 1rem; }
    .p-6 { padding: 1.5rem; }
    .p-8 { padding: 2rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-12 { margin-top: 3rem; }
    .mt-4 { margin-top: 1rem; }
    .flex { display: flex; }
    .justify-between { justify-content: space-between; }
    .items-center { align-items: center; }
    .gap-4 { gap: 1rem; }
    .grid { display: grid; }
    .md\:grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
    .gap-8 { gap: 2rem; }
    .hidden { display: none; }
    .cursor-pointer { cursor: pointer; }
    .transition-transform { transition: transform 0.3s; }
    .hover\:text-yellow-300:hover { color: #facc15; }
    .hover\:bg-green-700:hover { background-color: #15803d; }
    .hover\:bg-green-500:hover { background-color: #22c55e; }
    .text-2xl { font-size: 1.5rem; }
    .text-xl { font-size: 1.25rem; }
    .text-4xl { font-size: 2.25rem; }
    .font-bold { font-weight: bold; }
    .font-semibold { font-weight: 600; }
    .space-y-4 > * + * { margin-top: 1rem; }
    .space-y-12 > * + * { margin-top: 3rem; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animated { animation: fadeIn 0.5s ease-out; }
    .emergency-card:hover { transform: scale(1.02); }
    /* أزرار الحالة */
    button { border: none; outline: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <!-- شريط التنقل -->
  <nav class="bg-green-600 p-4 text-white shadow-lg">
    <div class="container flex justify-between items-center">
      <h1 class="text-2xl font-bold">🚑 دليل الإسعافات الأولية</h1>
      <div class="flex gap-4">
        <a href="tel:997" class="hover:text-yellow-300">📞 الطوارئ (997)</a>
        <a href="tel:937" class="hover:text-yellow-300">📞 وزارة الصحة (937)</a>
        <a href="#hospitalMap" class="hover:text-yellow-300">🗺 خريطة المستشفيات</a>
      </div>
    </div>
  </nav>

  <!-- المحتوى الرئيسي -->
  <main class="container" style="padding: 2rem;">
    <!-- بطاقات الحالات الطارئة -->
    <div class="grid md:grid-cols-3 gap-8">
      <!-- قالب البطاقة -->
      <template id="card-template">
        <div class="emergency-card bg-white rounded-xl p-8 shadow-md transition-transform cursor-pointer">
          <h3 class="text-2xl font-semibold text-green-700 mb-4 case-title"></h3>
          <p>اضغط لعرض طريقة التعامل</p>
        </div>
      </template>
    </div>

    <!-- خطوات الإسعافات -->
    <div class="bg-white rounded-xl p-8 shadow-md animated hidden" id="stepsContainer" style="margin-top: 2rem;">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold" id="caseTitle"></h2>
        <button onclick="closeSteps()" style="background: none; color: #16a34a; font-size: 1.25rem;">✕</button>
      </div>
      <div id="stepsWrapper"></div>
      <div class="flex justify-between" style="margin-top: 2rem;">
        <button id="resetBtn" onclick="resetSteps()" style="background-color: #16a34a; color: #fff;">🔄 إعادة</button>
        <button id="nextBtn" onclick="nextStep()" style="background-color: #16a34a; color: #fff;">التالي →</button>
      </div>
      <p id="finishedMsg" class="text-center" style="color: #16a34a; font-weight: bold; margin-top: 1.5rem; display: none; font-size: 1.25rem;">
        🎉 انتهت خطوات الإسعافات الأولية!
      </p>
    </div>

    <!-- خريطة المستشفيات -->
    <div class="bg-white rounded-xl p-8 shadow-md" id="hospitalMap" style="margin-top: 3rem;">
      <h2 class="text-2xl font-bold mb-4">🏥 أقرب المراكز الطبية</h2>
      <div id="map" style="height: 16rem; border-radius: 0.5rem;"></div>
    </div>
  </main>

  <!-- تذييل الصفحة -->
  <footer class="bg-green-700 text-white" style="padding: 1.5rem; margin-top: 3rem;">
    <div class="container text-center">
      <p>تم التطوير بواسطة مصطفى محمد نضال و عبدالله سليمان خلف | مشروع تخرج 2025</p>
      <button onclick="toggleDarkMode()" style="background-color: #16a34a; margin-top: 1rem; padding: 0.5rem 1rem; border-radius: 0.5rem;">
        🌙 الوضع الليلي
      </button>
    </div>
  </footer>

  <!-- تضمين كود جافا سكريبت داخل ملف HTML -->
  <script>
    // بيانات الحالات وخطواتها
    const cases = {
      "الحروق": [
        { emoji: "💧", text: "برد الحرق فورًا بالماء البارد لمدة 10 دقائق." },
        { emoji: "🩹", text: "غطِّ المنطقة بضمادة نظيفة وغير لاصقة." },
        { emoji: "🚑", text: "استدعِ الإسعاف إذا كانت الحروق شديدة." }
      ],
      "الغرق": [
        { emoji: "🚿", text: "أخرج الشخص من الماء وابدأ بالتنفس الاصطناعي إذا لزم." },
        { emoji: "🛏", text: "ضعه على جانبه لتجنب الاختناق بالقيء." },
        { emoji: "📞", text: "اتصل بالطوارئ فورًا." }
      ],
      "الصعق الكهربائي": [
        { emoji: "🔌", text: "افصل مصدر الكهرباء قبل الاقتراب." },
        { emoji: "🩹", text: "فحص المصاب وتغطية أي حروق بضمادة." },
        { emoji: "🚑", text: "استدعِ الإسعاف وتابع العلامات الحيوية." }
      ],
      "الإغماء": [
        { emoji: "✅", text: "تأكد من أن المكان آمن." },
        { emoji: "🛏", text: "ارفع الساقين لتحسين الدورة الدموية." },
        { emoji: "🗣", text: "تحدث مع المصاب وتحقق من وعيه." }
      ],
      "انخفاض أو ارتفاع السكر": [
        { emoji: "🍬", text: "إذا كان منخفضًا، أعطه سكرًا سريع المفعول." },
        { emoji: "💧", text: "إذا كان مرتفعًا، وفر له الماء." },
        { emoji: "📞", text: "اتصل بالطبيب أو الإسعاف إذا استمر الوضع." }
      ],
      "الاختناق": [
        { emoji: "🤚", text: "اضغط بقبضة اليد على بطن المصاب (هيمليك)." },
        { emoji: "🗣", text: "تحقق من خروج الجسم الغريب." },
        { emoji: "🚑", text: "استدعِ الإسعاف فورًا." }
      ],
      "الكسور والجروح": [
        { emoji: "🩹", text: "نظف الجرح وغطِّه بضمادة معقمة." },
        { emoji: "🔗", text: "ثبّت الكسر بجبيرة أو أي شيء صلب." },
        { emoji: "🚑", text: "استدعِ الإسعاف لنقل المصاب." }
      ],
      "ضربة الشمس": [
        { emoji: "☂", text: "انقل المصاب لمكان بارد ومظلل." },
        { emoji: "💧", text: "أعطه ماءً ببطء." },
        { emoji: "🚑", text: "اتصل بالطوارئ إذا ظهرت أعراض خطيرة." }
      ]
    };

    // إنشاء البطاقات ديناميكيًا
    const grid = document.querySelector('.grid');
    const template = document.getElementById('card-template');
    Object.keys(cases).forEach(name => {
      const clone = template.content.cloneNode(true);
      clone.querySelector('.case-title').textContent = name;
      const card = clone.querySelector('.emergency-card');
      card.addEventListener('click', () => showCase(name));
      grid.appendChild(clone);
    });

    // عرض الخطوات
    let currentStep = 0;
    let currentSteps = [];

    function showCase(name) {
      document.getElementById('caseTitle').textContent = name;
      currentSteps = cases[name];
      currentStep = 0;
      renderSteps();
      document.getElementById('stepsContainer').classList.remove('hidden');
      // التمرير التلقائي للقسم
      document.getElementById('stepsContainer').scrollIntoView({ behavior: "smooth" });
    }

    function renderSteps() {
      const wrapper = document.getElementById('stepsWrapper');
      wrapper.innerHTML = "";
      currentSteps.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = (i === currentStep ? "" : "hidden ") + "space-y-4";
        div.innerHTML = `
          <div style="display: flex; gap: 1rem; align-items: flex-start;">
            <span style="font-size: 2.25rem;">${s.emoji}</span>
            <p style="font-size: 1.125rem;">${s.text}</p>
          </div>`;
        wrapper.appendChild(div);
      });
      document.getElementById('resetBtn').disabled = (currentStep === 0);
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('finishedMsg').style.display = "none";
    }

    function nextStep() {
      if (currentStep < currentSteps.length - 1) {
        currentStep++;
        renderSteps();
      } else {
        document.getElementById('finishedMsg').style.display = "block";
        document.getElementById('nextBtn').disabled = true;
      }
    }

    function resetSteps() {
      currentStep = 0;
      renderSteps();
    }

    function closeSteps() {
      currentStep = 0;
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('finishedMsg').style.display = "none";
      renderSteps();
      document.getElementById('stepsContainer').classList.add('hidden');
    }

    // خريطة جوجل
    function initMap() {
      const center = { lat: 24.7136, lng: 46.6753 };
      new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: center,
      });
    }

    // الوضع الليلي
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
      if(document.body.classList.contains('dark')){
        document.body.style.backgroundColor = '#1a202c';
        document.body.style.color = '#fff';
      } else {
        document.body.style.backgroundColor = '#f0fff4';
        document.body.style.color = '#2d3748';
      }
    }
  </script>

  <!-- تضمين API لخريطة جوجل داخل الملف نفسه -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</body>
</html>
